name: Build LIFECARE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip LIFECARE_Android_Project_2.0.zip -d project
          find project \( -name settings.gradle -o -name settings.gradle.kts \) -print

      - name: Fix Android Build import
        run: |
          FILE=$(find project -name 'ReminderScheduler.java' -print -quit)
          if [ -z "$FILE" ]; then
            echo "ReminderScheduler.java not found"
            exit 1
          fi
          grep -q '^import android.os.Build;' "$FILE" || sed -i '/^package /a import android.os.Build;' "$FILE"

      - name: Fix Calendar import
        run: |
          FILE=$(find project -path '*/app/src/main/java/com/lifecare/daily/MainActivity.java' -print -quit)
          if [ -z "$FILE" ]; then
            echo "MainActivity.java not found"
            exit 1
          fi
          grep -q '^import java.util.Calendar;' "$FILE" || sed -i '/^package /a import java.util.Calendar;' "$FILE"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project
          SETTINGS=$(find . \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "Gradle settings file not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIFECARE-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
